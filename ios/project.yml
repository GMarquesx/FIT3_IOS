name: Elo
options:
  bundleIdPrefix: com.gmarquesx
  deploymentTarget:
    iOS: "17.0"
targets:
  Elo:
    type: application
    platform: iOS
    sources:
      - Elo
    info:
      path: Elo/Info.plist
      properties:
        CFBundleDisplayName: Elo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "O Elo usa o Bluetooth para conversar com a sua Galaxy Fit3."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmarquesx.elo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  Elo:
    build:
      targets:
        Elo: all
