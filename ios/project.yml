name: Elo
options:
  bundleIdPrefix: com.gmarquesx
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
targets:
  Elo:
    type: application
    platform: iOS
    sources:
      - Elo
    info:
      path: Elo/Info.plist
      properties:
        CFBundleDisplayName: Elo
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - pt-BR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - location
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
        NSBluetoothAlwaysUsageDescription: "Elo uses Bluetooth to talk to your Galaxy Fit3."
        NSLocationWhenInUseUsageDescription: "Elo uses GPS to measure the distance and pace of your runs."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Elo keeps recording your run while the screen is off."
        NSHealthUpdateUsageDescription: "Elo saves the steps, heart rate, blood oxygen and energy measured by your Galaxy Fit3 to the Health app."
        NSAppleMusicUsageDescription: "Elo shows the song playing in Apple Music on your Galaxy Fit3 and lets the band control it."
        NSHealthShareUsageDescription: "Elo reads Health data only to avoid saving the same sample twice."
    entitlements:
      path: Elo/Elo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmarquesx.elo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  Elo:
    build:
      targets:
        Elo: all
